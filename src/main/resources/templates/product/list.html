<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex: 1;
        }
        footer {
            background-color: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/products"><strong>📦 Quản lý sản phẩm</strong></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/products">Danh sách sản phẩm</a></li>
                    <li class="nav-item"><a class="nav-link" href="/products/add">Thêm sản phẩm</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📋 Danh sách sản phẩm</h2>
            <a href="/products/add" class="btn btn-success">➕ Thêm sản phẩm mới</a>
        </div>

        <div th:if="${#lists.isEmpty(products)}" class="alert alert-info">
            Chưa có sản phẩm nào. <a href="/products/add">Thêm sản phẩm ngay</a>
        </div>

        <div th:if="${!#lists.isEmpty(products)}" class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Tên sản phẩm</th>
                        <th>Giá</th>
                        <th>Hình ảnh</th>
                        <th>Danh mục</th>
                        <th class="text-center">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td th:text="${product.id}"></td>
                        <td th:text="${product.name}"></td>
                        <td th:text="${product.price}"></td>
                        <td>
                            <img th:if="${product.image != null and product.image != ''}" th:src="@{/assets/{img}(img=${product.image})}" width="80" class="img-thumbnail" th:alt="${product.name}">
                            <span th:if="${product.image == null or product.image == ''}" class="text-muted">-</span>
                        </td>
                        <td th:text="${product.category?.name}"></td>
                        <td class="text-center">
                            <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-primary">✏️ Sửa</a>
                            <form th:action="@{/products/{id}(id=${product.id})}" method="post" style="display:inline;">
                                <input type="hidden" name="_method" value="delete"/>
                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Xóa sản phẩm?')">🗑️ Xóa</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer class="text-center py-3 text-muted">
        <p class="mb-0">© 2280603561 - Nguyễn Đức Tuấn</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
