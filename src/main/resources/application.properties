spring.application.name=Bai5
spring.datasource.url=jdbc:mysql://localhost:3306/J2ee_Bai5
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.mvc.hiddenmethod.filter.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Quan trọng nhất: Ngăn Tomcat reset connection khi file vượt giới hạn
# -1 nghĩa là không giới hạn swallow → Spring sẽ bắt exception và trả response bình thường
server.tomcat.max-swallow-size=-1
