<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #f0f2f5; 
        }
        .login-card { 
            background: #fff; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 350px; 
        }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: #333; text-align: center; }
        p.subtitle { color: #666; font-size: 0.9rem; text-align: center; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; /* Quan trọng để input không tràn khung */
        }
        
        .btn-login { 
            width: 100%; 
            padding: 10px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px;
        }
        .btn-login:hover { background-color: #0056b3; }
        
        /* Thông báo lỗi và thành công */
        .flash { 
            padding: 10px; 
            border-radius: 4px; 
            margin-bottom: 15px; 
            font-size: 0.85rem; 
            text-align: center;
        }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        
        .badge { 
            display: block; 
            text-align: center; 
            color: #007bff; 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-size: 0.8rem;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <span class="badge">Product Hub</span>
    <h1>Hệ thống Quản lý</h1>
    <p class="subtitle">Vui lòng đăng nhập để tiếp tục</p>

    <div class="flash error" th:if="${param.error}">
        Tên đăng nhập hoặc mật khẩu không đúng.
    </div>

    <div class="flash success" th:if="${param.logout}">
        Bạn đã đăng xuất thành công.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Tài khoản</label>
            <input type="text" id="username" name="username" placeholder="Tên đăng nhập" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" placeholder="Mật khẩu" required>
        </div>

        <button type="submit" class="btn-login">Đăng nhập</button>
    </form>
    
    <p style="margin-top: 20px; font-size: 0.75rem; color: #999; text-align: center;">
        &copy; 2026 HUTECH - Nguyễn Trọng Phước
    </p>
</div>

</body>
</html>
